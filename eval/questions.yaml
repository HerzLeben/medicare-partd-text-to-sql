    JOIN partd.drug_class AS d
      ON d.gnrc_name_norm = pd.gnrc_name_norm AND d.drug_class = 'ANTIDEMENTIA'
    WHERE pd.year = 2024
    GROUP BY pd.prscrbr_type ORDER BY clms DESC LIMIT 5

- id: q28
  level: 3
  question: 2024年、非定型抗精神病薬の全国処方回数を薬剤別にトップ10
  expected_sql: |
    SELECT g.gnrc_name, SUM(g.tot_clms) AS clms
