    WHERE g.year = 2024 AND g.prscrbr_geo_lvl = 'National'
    GROUP BY g.gnrc_name ORDER BY clms DESC LIMIT 10

- id: q29
  level: 3
  question: 2024年、PPIの処方量（30日換算）が多い州トップ10
  expected_sql: |
    SELECT s.state_abrvtn, SUM(g.tot_30day_fills) AS fills
    FROM partd.geo_drug AS g
    JOIN partd.drug_class AS d ON d.gnrc_name_norm = g.gnrc_name_norm AND d.drug_class = 'PPI'
    JOIN partd.state AS s ON s.state_name = g.prscrbr_geo_desc AND s.is_state
    WHERE g.year = 2024 AND g.prscrbr_geo_lvl = 'State'
    GROUP BY s.state_abrvtn ORDER BY fills DESC LIMIT 10

- id: q30
  level: 3
  question: 2024年、エリキュースとイグザレルトの全国処方回数を比較
  expected_sql: |
    SELECT brnd_name, SUM(tot_clms) AS clms
    FROM partd.geo_drug
    WHERE year = 2024 AND prscrbr_geo_lvl = 'National'
      AND brnd_name_norm IN ('ELIQUIS', 'XARELTO')
    GROUP BY brnd_name ORDER BY clms DESC
